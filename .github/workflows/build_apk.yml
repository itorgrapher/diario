name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Create a fresh Flutter project scaffold
        run: |
          flutter create --platforms=android --org com.aitorgarcia --project-name tu_diario scaffold_tmp
          rm -rf scaffold_tmp/lib
          cp -r lib scaffold_tmp/lib
          cp pubspec.yaml scaffold_tmp/pubspec.yaml

      - name: Ensure minSdkVersion and Kotlin version are high enough for Firebase
        run: |
          KTS="scaffold_tmp/android/app/build.gradle.kts"
          GROOVY="scaffold_tmp/android/app/build.gradle"
          SETTINGS_KTS="scaffold_tmp/android/settings.gradle.kts"
          TOP_GROOVY="scaffold_tmp/android/build.gradle"

          if [ -f "$KTS" ]; then
            sed -i '/^\s*minSdk\s*=.*/d' "$KTS"
            sed -i '/^\s*minSdkVersion\s*=.*/d' "$KTS"
            sed -i '/defaultConfig {/a\        minSdk = 23' "$KTS"
          fi
          if [ -f "$GROOVY" ]; then
            sed -i '/^\s*minSdkVersion .*/d' "$GROOVY"
            sed -i '/^\s*minSdk .*/d' "$GROOVY"
            sed -i '/defaultConfig {/a\        minSdkVersion 23' "$GROOVY"
          fi

          # Bump the Kotlin Gradle plugin version, whichever convention this
          # Flutter version's template uses.
          if [ -f "$SETTINGS_KTS" ]; then
            sed -i -E 's/(id\("org\.jetbrains\.kotlin\.android"\) version ")[^"]+(")/\11.9.24\2/' "$SETTINGS_KTS"
          fi
          if [ -f "$TOP_GROOVY" ]; then
            sed -i -E "s/ext\.kotlin_version = ['\"][^'\"]+['\"]/ext.kotlin_version = '1.9.24'/" "$TOP_GROOVY"
          fi

          echo "---- resulting app gradle file ----"
          cat "$KTS" 2>/dev/null || cat "$GROOVY" 2>/dev/null || echo "(app gradle file not found at expected path)"
          echo "---- resulting top-level gradle (kotlin version) ----"
          cat "$SETTINGS_KTS" 2>/dev/null || true
          cat "$TOP_GROOVY" 2>/dev/null || true
          exit 0

      - name: Get dependencies
        working-directory: scaffold_tmp
        run: flutter pub get

      - name: Build release APK
        working-directory: scaffold_tmp
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tu-diario-apk
          path: scaffold_tmp/build/app/outputs/flutter-apk/app-release.apk
