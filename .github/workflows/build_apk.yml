name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create a fresh Flutter project scaffold
        run: |
          flutter create --platforms=android --org com.aitorgarcia --project-name tu_diario scaffold_tmp
          rm -rf scaffold_tmp/lib
          cp -r lib scaffold_tmp/lib
          cp pubspec.yaml scaffold_tmp/pubspec.yaml

      - name: Ensure minSdkVersion is high enough for Firebase
        run: |
          if [ -f scaffold_tmp/android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' scaffold_tmp/android/app/build.gradle.kts
          fi
          if [ -f scaffold_tmp/android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' scaffold_tmp/android/app/build.gradle
          fi

      - name: Get dependencies
        working-directory: scaffold_tmp
        run: flutter pub get

      - name: Build release APK
        working-directory: scaffold_tmp
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tu-diario-apk
          path: scaffold_tmp/build/app/outputs/flutter-apk/app-release.apk
